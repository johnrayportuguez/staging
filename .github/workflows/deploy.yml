name: Publish Website

on:
  push:
    branches:
      - main


jobs:
  web-deploy:
    name: 🚀 Deploy Website Every Commit
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v3
    
    - name: 📂 Sync Files
      uses: SamKirkland/web-deploy@v1
      with:
        server: www.siteflicker.com
        username: wuhxiabj
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./
        server-dir: /home/wuhxiabj/www.siteflicker.com/wp-content/themes/staging/
